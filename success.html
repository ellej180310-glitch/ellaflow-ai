<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Sent | EllaFlow AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #fff7ed, #fdf2f8, #ecfdf5);
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      background: white;
      padding: 50px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.15);
      max-width: 520px;
    }

    h1 {
      color: #7c3aed;
      margin-bottom: 15px;
    }

    p {
      color: #4b5563;
      font-size: 18px;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      background: #f97316;
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Request Sent Successfully</h1>
    <p>Thank you. Your request has been sent and will be reviewed shortly.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
